name: SQL Server
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sqlserver: ['2022', '2025']
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:${{ matrix.sqlserver }}-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: OpenBase-CI-only-2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'OpenBase-CI-only-2026!' -C -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      OpenBaseDatabase: sqlserver
      OPENBASE_TEST_SQLSERVER: Server=localhost,1433;Database=master;User ID=sa;Password=OpenBase-CI-only-2026!;Encrypt=True;TrustServerCertificate=True
      ConnectionStrings__Default: Server=localhost,1433;Database=master;User ID=sa;Password=OpenBase-CI-only-2026!;Encrypt=True;TrustServerCertificate=True
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore OpenBaseNET.sln
      - run: dotnet build OpenBaseNET.sln --no-restore --configuration Release
      - run: python3 scripts/check-provider.py sqlserver
      - run: dotnet test OpenBaseNET.sln --no-build --configuration Release --logger "trx;LogFileName=sqlserver.trx"
      - run: dotnet tool restore
      - run: python3 scripts/check-migration-isolation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sqlserver-${{ matrix.sqlserver }}-tests
          path: tests/**/TestResults/*.trx
