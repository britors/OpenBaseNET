name: PostgreSQL
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ['16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPENBASE_TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
      ConnectionStrings__Default: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore OpenBaseNET.sln
      - run: dotnet build OpenBaseNET.sln --no-restore --configuration Release
      - run: python3 scripts/check-provider.py postgres
      - run: dotnet test tests/OpenBaseNET.Tests.Integration --no-build --configuration Release --logger "trx;LogFileName=postgres.trx"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-contracts.txt
      - run: python scripts/pack-template.py --version 11.0.0-preview.1
      - run: python scripts/check-template.py --package artifacts/packages/w3ti.OpenBaseNET.Template.11.0.0-preview.1.nupkg --database postgres --integration --output artifacts/generated
      - run: dotnet tool restore
      - run: python3 scripts/check-migration-isolation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-${{ matrix.postgres }}-tests
          path: |
            tests/**/TestResults/*.trx
            artifacts/generated/**/TestResults/*.trx
