name: Oracle
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      oracle:
        image: gvenzl/oracle-free:23.26.3-slim-faststart
        env:
          ORACLE_PASSWORD: OpenBase-CI-only-2026
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      OpenBaseDatabase: oracle
      OPENBASE_TEST_ORACLE: User Id=system;Password=OpenBase-CI-only-2026;Data Source=localhost:1521/FREEPDB1;Pooling=false
      ConnectionStrings__Default: User Id=system;Password=OpenBase-CI-only-2026;Data Source=localhost:1521/FREEPDB1;Pooling=false
    steps:
      - uses: actions/checkout@v4
      - name: Connect directly to the Oracle service network
        env:
          ORACLE_SERVICE_ID: ${{ job.services.oracle.id }}
        run: |
          oracle_host=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$ORACLE_SERVICE_ID")
          test -n "$oracle_host"
          echo "OPENBASE_TEST_ORACLE=User Id=system;Password=OpenBase-CI-only-2026;Data Source=$oracle_host:1521/FREEPDB1;Pooling=false" >> "$GITHUB_ENV"
          echo "ConnectionStrings__Default=User Id=system;Password=OpenBase-CI-only-2026;Data Source=$oracle_host:1521/FREEPDB1;Pooling=false" >> "$GITHUB_ENV"
      - name: Enable out-of-band cancellation on the test server
        env:
          ORACLE_SERVICE_ID: ${{ job.services.oracle.id }}
        run: |
          # The image disables OOB to work around Docker proxy issues. The direct
          # service IP above bypasses that proxy and preserves urgent break signals.
          docker exec "$ORACLE_SERVICE_ID" sh -eu -c '
            sed -i "s/^DISABLE_OOB=.*/DISABLE_OOB=OFF/" "$ORACLE_HOME/network/admin/sqlnet.ora"
            grep -qx "DISABLE_OOB=OFF" "$ORACLE_HOME/network/admin/sqlnet.ora"
            lsnrctl stop
            lsnrctl start
          '
          docker exec -i "$ORACLE_SERVICE_ID" sqlplus -s / as sysdba <<'SQL'
          WHENEVER SQLERROR EXIT FAILURE
          ALTER SYSTEM REGISTER;
          EXIT
          SQL
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore OpenBaseNET.sln
      - run: dotnet build OpenBaseNET.sln --no-restore --configuration Release
      - run: python3 scripts/check-provider.py oracle
      - run: dotnet test OpenBaseNET.sln --no-build --configuration Release --logger "trx;LogFileName=oracle.trx"
      - run: dotnet tool restore
      - run: python3 scripts/check-migration-isolation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-tests
          path: tests/**/TestResults/*.trx
